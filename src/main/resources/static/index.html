<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mars Rover</title>
        <link rel="icon" type="image/png" href="images/favicon.png" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="message-box"></div>

        <div id="container"></div>

        <div id="container-footer">
            <div id="view-panel">
                <input
                    type="text"
                    id="input-commands"
                    readonly
                    placeholder="Commands"
                />
                <button type="button" id="button-send" class="button">
                    <img src="images/send.png" alt="Send" />
                </button>
                <button type="button" id="button-clear" class="button">
                    <img src="images/clear.png" alt="Clear" />
                </button>
            </div>

            <div id="controls">
                <button type="button" id="button-moveForward" class="button">
                    <img
                        src="images/moveForward.png"
                        alt="Move forward command"
                    />
                </button>
                <button type="button" id="button-turnLeft" class="button">
                    <img src="images/turnLeft.png" alt="Turn left command" />
                </button>
                <button type="button" id="button-turnRight" class="button">
                    <img src="images/turnRight.png" alt="Turn right command" />
                </button>
                <button type="button" id="button-add-obstacle" class="button">
                    <img src="images/obstacle.png" alt="Add Obstacle" />
                </button>
                <button type="button" id="button-reset" class="button">
                    <img src="images/reset.png" alt="Reset" />
                </button>
            </div>
        </div>

        <div id="modal-overlay">
            <div id="coordinate-modal">
                <div class="title-row">Enter the Position of the Obstacle</div>
                <div class="input-row">
                    <label for="input-posX">Axis X:</label>
                    <input type="number" id="input-posX" min="0" />
                </div>
                <div class="input-row">
                    <label for="input-posY">Axis Y:</label>
                    <input type="number" id="input-posY" min="0" />
                </div>
                <div class="input-row">
                    <button id="button-send-position" class="modal-button">
                        OK
                    </button>
                    <button id="button-cancel" class="modal-button">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="javascript/main.js"></script>
    </body>
</html>
